name: release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      new: ${{ steps.read.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git ls-remote --exit-code --tags origin "$tag" > /dev/null || echo "new=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Package
        shell: pwsh
        run: |
          $dir = "mempe-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/mempe.exe" "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip" -Force

      - name: Generate notes
        shell: bash
        run: |
          current="${{ needs.version.outputs.tag }}"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${current}"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > NOTES.md
          cat NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: NOTES.md
          files: mempe-windows-x86_64.zip
